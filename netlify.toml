[build]
  command = "pnpm build"
  publish = "dist"
  functions = "/netlify/functions"

[build.environment]
  NPM_FLAGS = "--shamefully-hoist"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["resend", "stripe"]

[functions.esbuild]
  format = "esm"
  platform = "node"
  target = "node18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# No SPA catch-all: every route is prerendered to its own HTML file (scripts/prerender.mjs), so
# unknown paths fall through to dist/404.html with a real 404 status instead of a soft 200.